apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tic-tac-toe-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx  # This is the key change
  rules:
  - host: tictactoe.local  # Ensure this matches the domain in your /etc/hosts file
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tic-tac-toe-service  # Ensure this matches the service name
            port:
              number: 80              # This should be the service's port (internally exposed as 80)
